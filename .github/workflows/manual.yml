# Veröffentlicht das Handbuch (manual/) auf GitHub Pages, siehe docs/manual.md.
# Die Bilder vom Gerät (manual/img/) entstehen dabei mit tools/screenshots.py; sie liegen nie im Repo.
name: Handbuch veröffentlichen

on:
  push:
    branches: [main]
    paths: ["manual/**", "device/**", "apps/**", "tools/preview.py", "tools/screenshots.py",
            "tests/weather_sample.json", ".github/workflows/manual.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bilder vom Gerät zeichnen
        run: |
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install pillow
          python tools/screenshots.py manual/img
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: manual
      - id: deployment
        uses: actions/deploy-pages@v4
